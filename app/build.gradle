plugins {
    id "com.android.application"
}

android {
    namespace "com.nhkdaily"
    compileSdk 35

    defaultConfig {
        applicationId "com.nhkdaily"
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "org.jsoup:jsoup:1.17.2"
}
