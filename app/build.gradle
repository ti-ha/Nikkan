plugins {
    id "com.android.application"
}

android {
    namespace "com.nhkdaily"
    compileSdk 35

    defaultConfig {
        applicationId "com.nhkdaily"
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            // Kuromoji's two jars both carry these text files; they aren't needed in the app.
            excludes += ["META-INF/*.md", "META-INF/LICENSE*", "META-INF/NOTICE*", "META-INF/DEPENDENCIES"]
        }
    }
}

dependencies {
    implementation "org.jsoup:jsoup:1.17.2"
    // Japanese word splitting + readings for furigana on regular NHK articles (IPADIC dictionary)
    implementation "com.atilika.kuromoji:kuromoji-ipadic:0.9.0"
}
